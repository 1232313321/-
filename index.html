<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Судебный Секретариат | Реестр исковых заявлений</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f4f9; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: auto; background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; border-bottom: 3px solid #34495e; padding-bottom: 15px; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: #fff; }
        th { background-color: #34495e; color: #ecf0f1; padding: 15px; text-align: left; font-size: 13px; text-transform: uppercase; border: 1px solid #2c3e50; }
        td { padding: 12px 15px; border: 1px solid #e1e1e1; font-size: 14px; line-height: 1.4; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        tr:hover { background-color: #f1f4f7; transition: 0.2s; }
        
        .status-badge { padding: 5px 10px; border-radius: 4px; font-weight: bold; font-size: 12px; display: inline-block; text-align: center; min-width: 100px; }
        .st-принято { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .st-ожидание { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .st-отклонено { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .st-в { background-color: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        .st-закрыто { background-color: #e2e3e5; color: #383d41; border: 1px solid #d6d8db; }
        
        .last-update { text-align: right; font-size: 11px; color: #7f8c8d; margin-top: 15px; font-style: italic; }
        @media (max-width: 768px) { .container { padding: 10px; } th, td { padding: 8px; font-size: 12px; } }
    </style>
</head>
<body>

<div class="container">
    <h1>Реестр исковых заявлений штата San Andreas</h1>
    <table id="courtTable">
        <thead>
            <tr>
                <th>№ Иска</th>
                <th>Актуальный статус</th>
                <th>Дата и время заседания</th>
                <th>Место проведения</th>
                <th>Связь с секретарем</th>
            </tr>
        </thead>
        <tbody>
            <!-- Данные загружаются автоматически -->
        </tbody>
    </table>
    <div class="last-update" id="updateTime">Загрузка данных...</div>
</div>

<script>
    // ВСТАВЬТЕ ВАШУ ССЫЛКУ НА CSV НИЖЕ
    const csvUrl = 'ВАША_ССЫЛКА_ИЗ_GOOGLE_ТАБЛИЦ_ЗДЕСЬ';

    async function fetchData() {
        try {
            const response = await fetch(csvUrl);
            const csvText = await response.text();
            const rows = parseCsv(csvText).slice(1); // Пропускаем заголовки
            renderTable(rows);
            document.getElementById('updateTime').innerText = 'Последнее обновление: ' + new Date().toLocaleTimeString();
        } catch (error) {
            console.error('Ошибка при загрузке данных:', error);
            document.getElementById('updateTime').innerText = 'Ошибка обновления данных. Проверьте соединение.';
        }
    }

    function parseCsv(text) {
        const lines = text.split(/\r?\n/);
        return lines.map(line => {
            const result = [];
            let current = '';
            let inQuotes = false;
            for (let char of line) {
                if (char === '"') inQuotes = !inQuotes;
                else if (char === ',' && !inQuotes) {
                    result.push(current.trim());
                    current = '';
                } else {
                    current += char;
                }
            }
            result.push(current.trim());
            return result;
        });
    }

    function renderTable(data) {
        const tbody = document.querySelector('#courtTable tbody');
        tbody.innerHTML = '';

        data.forEach(cols => {
            if (cols.length >= 5 && cols[0] !== "") {
                const tr = document.createElement('tr');
                
                // Определение стиля статуса
                const statusText = cols[1] || 'Не определен';
                const firstWord = statusText.split(' ')[0].toLowerCase();
                let statusClass = 'st-закрыто';
                if (firstWord.includes('принят')) statusClass = 'st-принято';
                else if (firstWord.includes('ожид')) statusClass = 'st-ожидание';
                else if (firstWord.includes('отклон')) statusClass = 'st-отклонено';
                else if (firstWord.includes('в')) statusClass = 'st-в';

                tr.innerHTML = `
                    <td><b>${cols[0]}</b></td>
                    <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                    <td>${cols[2] || '—'}</td>
                    <td>${cols[3] || '—'}</td>
                    <td>${cols[4] || '—'}</td>
                `;
                tbody.appendChild(tr);
            }
        });
    }

    // Первоначальный запуск
    fetchData();
    // Автоматическое обновление каждые 30 секунд
    setInterval(fetchData, 30000);
</script>

</body>
</html>
